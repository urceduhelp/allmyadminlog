<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - සටහන් පොත</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans Sinhala', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #667eea; margin-bottom: 30px; }
        h2 { color: #667eea; margin: 20px 0; }
        .form-group { margin-bottom: 20px; position: relative; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Noto Sans Sinhala', sans-serif;
        }
        textarea { min-height: 400px; resize: vertical; }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans Sinhala', sans-serif;
        }
        .btn-success {
            background: linear-gradient(135deg, #34a853 0%, #2d9248 100%);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ea4335 0%, #d33b2c 100%);
            color: white;
        }
        .btn-secondary { background: #6c757d; color: white; }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .lessons-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            overflow-x: auto;
            display: block;
        }
        .lessons-table th, .lessons-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }
        .lessons-table th {
            background: #667eea;
            color: white;
            position: sticky;
            top: 0;
        }
        .lessons-table tr:hover { background: #f5f5f5; }
        .lessons-table tbody { display: table; width: 100%; }
        .action-buttons { display: flex; gap: 10px; }
        .action-buttons button { padding: 8px 16px; font-size: 14px; }
        .hidden { display: none; }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .category-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .category-tab {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
        }
        .category-tab.active { background: #667eea; color: white; }
        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }
        .top-bar h1 { margin-bottom: 0; }
        .editor-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .editor-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .editor-btn:hover { background: #5568d3; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .admin-container { padding: 15px; margin: 0; }
            h1 { font-size: 1.5em; }
            h2 { font-size: 1.2em; }
            .category-tabs { flex-direction: column; }
            .category-tab { width: 100%; }
            .lessons-table { font-size: 14px; }
            .lessons-table th, .lessons-table td { padding: 8px 4px; font-size: 12px; }
            .action-buttons { flex-direction: column; gap: 5px; }
            .action-buttons button { width: 100%; padding: 6px 12px; font-size: 12px; }
            .editor-toolbar { gap: 5px; }
            .editor-btn { padding: 6px 12px; font-size: 12px; }
            textarea { min-height: 300px; font-size: 14px; }
            input[type="text"], select { font-size: 14px; padding: 10px; }
            button { font-size: 14px; padding: 10px 20px; }
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.3em; }
            .lessons-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .lessons-table thead { display: none; }
            .lessons-table tr {
                display: block;
                margin-bottom: 15px;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 10px;
                background: white;
            }
            .lessons-table td {
                display: block;
                text-align: left;
                padding: 8px 0;
                border: none;
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <div id="adminView" class="admin-container">
        <div class="top-bar">
            <h1>📝 සටහන් පොත Admin Panel</h1>
        </div>

        <div id="alertBox"></div>

        <div class="category-tabs">
            <button class="category-tab active" data-category="slhis" onclick="selectCategory('slhis')">ශ්‍රී ලංකාව</button>
            <button class="category-tab" data-category="erphis" onclick="selectCategory('erphis')">යුරෝපය</button>
            <button class="category-tab" data-category="indhis" onclick="selectCategory('indhis')">ඉන්දියාව</button>
        </div>

        <button class="btn-success" onclick="showAddForm()" style="margin-bottom: 20px;">➕ නව පාඩමක් එකතු කරන්න</button>

        <div id="lessonsListView">
            <h2>සටහන් ලැයිස්තුව</h2>
            <table class="lessons-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Slug</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="lessonsTableBody"></tbody>
            </table>
        </div>

        <div id="editView" class="hidden">
            <h2 id="editTitle">සටහන සංස්කරණය කරන්න</h2>
            <div class="form-group">
                <label>පාඩම තෝරන්න (දැනට ඇති මාතෘකා)</label>
                <select id="lessonSelect" onchange="onLessonSelect()"></select>
            </div>
            <div class="form-group hidden" id="newSlugGroup">
                <label>අලුත් Slug (slhis01, erphis02, indhis03 ආදිය)</label>
                <input type="text" id="editLessonSlug" placeholder="slug ඇතුලත් කරන්න">
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="editLessonTitle" placeholder="පාඩමේ නම ඇතුලත් කරන්න">
            </div>
            <div class="form-group">
                <label>Content (HTML)</label>
                <div class="editor-toolbar">
                    <button class="editor-btn" onclick="insertTag('h1')">H1</button>
                    <button class="editor-btn" onclick="insertTag('h2')">H2</button>
                    <button class="editor-btn" onclick="insertTag('h3')">H3</button>
                    <button class="editor-btn" onclick="insertTag('p')">P</button>
                    <button class="editor-btn" onclick="insertTag('strong')">Bold</button>
                    <button class="editor-btn" onclick="insertTag('em')">Italic</button>
                    <button class="editor-btn" onclick="insertTag('ul')">List</button>
                </div>
                <textarea id="editLessonContent" placeholder="HTML content ඇතුලත් කරන්න"></textarea>
            </div>
            <div class="action-buttons">
                <button class="btn-success" onclick="saveLesson()">💾 Save</button>
                <button class="btn-secondary" onclick="cancelEdit()">❌ Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://uqgzlaxsnknheoerbfus.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxZ3psYXhzbmtuaGVvZXJiZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjM2MTUsImV4cCI6MjA3OTI4MzYxNX0.IYWZ7ukx8J-GJMWy7cMk2BWnmzJmJjjE93yEmJie7nQ';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let state = {
            currentCategory: 'slhis',
            lessons: [],
            editingLesson: null
        };

        function selectCategory(category) {
            state.currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`[data-category="${category}"]`).classList.add('active');
            cancelEdit();
            loadLessons();
        }

        async function loadLessons() {
            try {
                const { data, error } = await sbClient
                    .from('Historynt')
                    .select('*')
                    .like('slug', state.currentCategory + '%')
                    .order('slug', { ascending: true });

                if (error) throw error;

                state.lessons = data;
                displayLessons();
            } catch (err) {
                console.error('Error loading lessons:', err);
                showAlert('Failed to load lessons: ' + err.message, 'error');
            }
        }

        function displayLessons() {
            const tbody = document.getElementById('lessonsTableBody');
            tbody.innerHTML = state.lessons.map((lesson, index) => `
                <tr>
                    <td>${lesson.title}</td>
                    <td>${lesson.slug}</td>
                    <td>${getCategoryName(lesson.slug)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-success" onclick="editLesson(${index})">✏️ Edit</button>
                            <button class="btn-danger" onclick="deleteLesson(${index})">🗑️ Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function getCategoryName(slug) {
            if (slug.startsWith('slhis')) return 'ශ්‍රී ලංකාව';
            if (slug.startsWith('erphis')) return 'යුරෝපය';
            if (slug.startsWith('indhis')) return 'ඉන්දියාව';
            return 'Unknown';
        }

        function populateSelect(selectedValue) {
            const select = document.getElementById('lessonSelect');
            select.innerHTML = '';

            const newOpt = document.createElement('option');
            newOpt.value = '__new__';
            newOpt.textContent = '➕ නව පාඩමක් එකතු කරන්න';
            select.appendChild(newOpt);

            state.lessons.forEach(lesson => {
                const opt = document.createElement('option');
                opt.value = lesson.slug;
                opt.textContent = lesson.title + ' (' + lesson.slug + ')';
                select.appendChild(opt);
            });

            select.value = selectedValue;
        }

        function onLessonSelect() {
            const value = document.getElementById('lessonSelect').value;
            const newSlugGroup = document.getElementById('newSlugGroup');

            if (value === '__new__') {
                state.editingLesson = null;
                document.getElementById('editTitle').textContent = 'නව පාඩමක් එකතු කරන්න';
                document.getElementById('editLessonTitle').value = '';
                document.getElementById('editLessonSlug').value = '';
                document.getElementById('editLessonContent').value = '';
                newSlugGroup.classList.remove('hidden');
            } else {
                const lesson = state.lessons.find(l => l.slug === value);
                if (!lesson) return;
                state.editingLesson = lesson;
                document.getElementById('editTitle').textContent = 'සටහන සංස්කරණය කරන්න';
                document.getElementById('editLessonTitle').value = lesson.title;
                document.getElementById('editLessonSlug').value = lesson.slug;
                document.getElementById('editLessonContent').value = lesson.content;
                newSlugGroup.classList.add('hidden');
            }
        }

        function openEditor(selectedValue) {
            populateSelect(selectedValue);
            onLessonSelect();
            document.getElementById('lessonsListView').classList.add('hidden');
            document.getElementById('editView').classList.remove('hidden');
        }

        function showAddForm() {
            openEditor('__new__');
        }

        function editLesson(index) {
            const lesson = state.lessons[index];
            if (!lesson) return;
            openEditor(lesson.slug);
        }

        function cancelEdit() {
            document.getElementById('editView').classList.add('hidden');
            document.getElementById('lessonsListView').classList.remove('hidden');
        }

        async function saveLesson() {
            const title = document.getElementById('editLessonTitle').value.trim();
            const slug = document.getElementById('editLessonSlug').value.trim();
            const content = document.getElementById('editLessonContent').value.trim();

            if (!title || !slug || !content) {
                showAlert('Please fill all fields', 'error');
                return;
            }

            try {
                if (state.editingLesson) {
                    const { error } = await sbClient
                        .from('Historynt')
                        .update({ title, slug, content })
                        .eq('slug', state.editingLesson.slug);

                    if (error) throw error;
                    showAlert('සටහන සාර්ථකව යාවත්කාලීන කරන ලදී!', 'success');
                } else {
                    const { error } = await sbClient
                        .from('Historynt')
                        .insert([{ title, slug, content }]);

                    if (error) throw error;
                    showAlert('නව සටහන සාර්ථකව එකතු කරන ලදී!', 'success');
                }

                cancelEdit();
                loadLessons();
            } catch (err) {
                console.error('Save error:', err);
                showAlert('Error saving: ' + err.message, 'error');
            }
        }

        async function deleteLesson(index) {
            const lesson = state.lessons[index];
            if (!lesson) return;
            if (!confirm(`"${lesson.title}" මකා දැමීමට විශ්වාසද?`)) return;

            try {
                const { error } = await sbClient
                    .from('Historynt')
                    .delete()
                    .eq('slug', lesson.slug);

                if (error) throw error;
                showAlert('සටහන සාර්ථකව මකා දමන ලදී!', 'success');
                loadLessons();
            } catch (err) {
                console.error('Delete error:', err);
                showAlert('Error deleting: ' + err.message, 'error');
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `<div class="alert alert-${type === 'error' ? 'error' : 'success'}">${message}</div>`;
            setTimeout(() => { alertBox.innerHTML = ''; }, 5000);
        }

        function insertTag(tag) {
            const textarea = document.getElementById('editLessonContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);

            let insertion;
            if (tag === 'ul') {
                insertion = `<ul>\n  <li>${selectedText || 'Item 1'}</li>\n  <li>Item 2</li>\n</ul>`;
            } else {
                insertion = `<${tag}>${selectedText || 'Text'}</${tag}>`;
            }

            textarea.value = textarea.value.substring(0, start) + insertion + textarea.value.substring(end);
            textarea.focus();
        }

        // Page එක open වුණ ගමන් පාඩම් load කරන්න
        loadLessons();
    </script>
</body>
</html>
