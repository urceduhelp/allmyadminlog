<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>මගේ පුස්තකාලය</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1d5c4a;--bd:#ddd9ce;--rd:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1d;--tx:#efece4;--mu:#9b978c;--ac:#4fb394;--bd:#38352f;--rd:#f2766e}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 14px;border:0;border-radius:7px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--rd);border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:10px}
label{font-size:12px;color:var(--mu)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-weight:500;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#msg{font-size:13px;color:var(--mu);margin:6px 0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<!-- Login -->
<div id="login" class="card hide" style="max-width:380px;margin:60px auto">
  <h1>පුස්තකාලය — Login</h1><br>
  <label>Email</label><input id="em" type="email"><br><br>
  <label>මුරපදය</label><input id="pw" type="password"><br><br>
  <button onclick="signIn()">ඇතුල් වන්න</button>
  <div id="lmsg" style="color:var(--rd);font-size:13px;margin-top:8px"></div>
</div>

<!-- App -->
<div id="app" class="hide">
  <div class="bar"><h1>📚 මගේ පුස්තකාලය <span id="cnt" style="color:var(--mu);font-size:13px"></span></h1>
    <button class="g" onclick="signOut()">Logout</button></div>

  <div class="card">
    <b id="ftitle">නව පොතක් ඇතුළත් කරන්න</b>
    <div class="grid" style="margin-top:10px">
      <div><label>පොතේ නම</label><input id="f_title"></div>
      <div><label>කතුවරයා</label><input id="f_author"></div>
      <div><label>විෂයය</label><input id="f_subject"></div>
      <div><label>මිල</label><input id="f_price" type="number" step="0.01"></div>
      <div><label>ISBN</label><input id="f_isbn"></div>
      <div><label>පොත් අංකය</label><input id="f_book_number"></div>
      <div><label>රාක්ක අංකය</label><input id="f_rack_number"></div>
      <div><label>තට්ටු (Shelf) අංකය</label><input id="f_shelf_number"></div>
    </div>
    <div class="row">
      <button onclick="save()">සුරකින්න</button>
      <button class="g" onclick="resetForm()">හිස් කරන්න</button>
      <span style="flex:1"></span>
      <label class="row" style="font-size:13px">CSV Import:&nbsp;<input type="file" id="csv" accept=".csv" style="width:auto" onchange="importCSV(this.files[0])"></label>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <input id="q" placeholder="🔍 නම, කතුවරයා, විෂයය, ISBN හෝ පොත් අංකය මගින් සොයන්න..." oninput="debounce()">
    <div class="row" style="margin-top:8px"><span style="font-size:13px;color:var(--mu)">ස්ථානය:</span>
      <input id="fr" placeholder="රාක්ක අංකය" oninput="debounce()" style="width:140px">
      <input id="fs" placeholder="තට්ටු අංකය" oninput="debounce()" style="width:140px">
      <button class="g" onclick="$('fr').value=$('fs').value=$('q').value='';page=0;load()">පෙරහන් හිස් කරන්න</button></div>
    <div class="tw" style="margin-top:10px">
      <table><thead><tr><th>පොතේ නම</th><th>කතුවරයා</th><th>විෂයය</th><th>මිල</th><th>ISBN</th><th>පොත් අං.</th><th>රාක්කය</th><th>තට්ටුව</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table>
    </div>
    <div class="row" style="margin-top:10px;justify-content:center">
      <button class="g" onclick="go(-1)">← පෙර</button><span id="pg"></span><button class="g" onclick="go(1)">ඊළඟ →</button>
    </div>
  </div>
</div>
</div>

<script>
const SUPABASE_URL = "https://jcijglwpkfluyzrltimk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const F = ["title","author","subject","price","isbn","book_number","rack_number","shelf_number"];
const PAGE = 50;
let page = 0, editId = null, timer, rows = [];

function show(authed){ $("login").classList.toggle("hide", authed); $("app").classList.toggle("hide", !authed); if(authed) load(); }
async function signIn(){
  const {error} = await sb.auth.signInWithPassword({email:$("em").value.trim(), password:$("pw").value});
  if(error) $("lmsg").textContent = error.message; else show(true);
}
async function signOut(){ await sb.auth.signOut(); show(false); }
sb.auth.getSession().then(({data}) => show(!!data.session));

const clean = v => { v = (v ?? "").toString().trim(); return v === "" ? null : v; };
function formData(){
  const o = {}; F.forEach(k => o[k] = clean($("f_"+k).value));
  if(o.price !== null){ const n = parseFloat(o.price); o.price = isNaN(n) ? null : n; }
  return o;
}
function resetForm(){ F.forEach(k => $("f_"+k).value = ""); editId = null; $("ftitle").textContent = "නව පොතක් ඇතුළත් කරන්න"; }
function say(t){ $("msg").textContent = t; }

async function save(){
  const d = formData();
  if(Object.values(d).every(v => v === null)){ say("අවම වශයෙන් එක් දත්තයක් හෝ ඇතුළත් කරන්න."); return; }
  const r = editId ? await sb.from("books").update(d).eq("id", editId) : await sb.from("books").insert(d);
  if(r.error){ say("දෝෂයක්: " + r.error.message); return; }
  say(editId ? "යාවත්කාලීන කළා ✔" : "ඇතුළත් කළා ✔");
  resetForm(); load();
}
function edit(i){
  const b = rows[i]; editId = b.id;
  F.forEach(k => $("f_"+k).value = b[k] ?? "");
  $("ftitle").textContent = "සංස්කරණය (#" + b.id + ")"; window.scrollTo({top:0,behavior:"smooth"});
}
async function del(id){
  if(!confirm("මෙම පොත මකන්නද?")) return;
  const {error} = await sb.from("books").delete().eq("id", id);
  if(error) say(error.message); else load();
}

function debounce(){ clearTimeout(timer); timer = setTimeout(() => { page = 0; load(); }, 300); }
function go(n){ if(page + n < 0) return; page += n; load(); }

async function load(){
  let qb = sb.from("books").select("*", {count:"exact"}).order("id", {ascending:false}).range(page*PAGE, page*PAGE + PAGE - 1);
  const q = $("q").value.replace(/[,()%*]/g, " ").trim();
  const rk = clean($("fr").value), sh = clean($("fs").value);
  if(rk) qb = qb.ilike("rack_number", rk.replace(/[%*_]/g, ""));
  if(sh) qb = qb.ilike("shelf_number", sh.replace(/[%*_]/g, ""));
  if(rk || sh) qb = qb.order("rack_number").order("shelf_number").order("book_number");
  if(q) qb = qb.or(["title","author","subject","isbn","book_number"].map(c => `${c}.ilike.%${q}%`).join(","));
  const {data, count, error} = await qb;
  if(error){ say(error.message); return; }
  rows = data;
  $("cnt").textContent = "— " + (count ?? 0) + " ප්‍රතිඵල";
  $("pg").textContent = "පිටුව " + (page+1);
  const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  $("tb").innerHTML = data.map((b,i) => `<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.subject)}</td>
    <td>${b.price ?? ""}</td><td>${esc(b.isbn)}</td><td>${esc(b.book_number)}</td><td><b>${esc(b.rack_number)}</b></td><td><b>${esc(b.shelf_number)}</b></td>
    <td style="white-space:nowrap"><button class="g" onclick="edit(${i})">✎</button> <button class="d" onclick="del(${b.id})">✕</button></td></tr>`).join("")
    || `<tr><td colspan="9" style="color:var(--mu)">කිසිවක් නැත</td></tr>`;
}

/* CSV import: headers = title,author,subject,price,isbn (ඕනෑම අනුපිළිවෙලක්, UTF-8) */
function parseCSV(t,d){
  const out = []; let r = [], c = "", q = false;
  for(let i = 0; i < t.length; i++){
    const ch = t[i];
    if(q){ if(ch === '"'){ if(t[i+1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; }
    else if(ch === '"') q = true;
    else if(ch === d){ r.push(c); c = ""; }
    else if(ch === "\n"){ r.push(c); out.push(r); r = []; c = ""; }
    else if(ch !== "\r") c += ch;
  }
  if(c !== "" || r.length){ r.push(c); out.push(r); }
  return out;
}
async function importCSV(file){
  if(!file) return;
  const t = (await file.text()).replace(/^\uFEFF/, "");
  const first = t.split("\n")[0];
  const d = first.includes("\t") ? "\t" : (first.includes(";") && !first.includes(",") ? ";" : ",");
  const [h, ...body] = parseCSV(t, d);
  const idx = {}; h.forEach((x,i) => idx[x.trim().toLowerCase()] = i);
  if(!F.some(k => idx[k] !== undefined)){ say("Import දෝෂය: පළමු පේළියේ title, author, subject, price, isbn යන headings නැත."); return; }
  const recs = body.map(r => { const o = {}; F.forEach(k => o[k] = idx[k] === undefined ? null : clean(r[idx[k]]));
    if(o.price !== null){ const n = parseFloat(o.price); o.price = isNaN(n) ? null : n; } return o; })
    .filter(o => Object.values(o).some(v => v !== null));
  for(let i = 0; i < recs.length; i += 500){
    const {error} = await sb.from("books").insert(recs.slice(i, i+500));
    if(error){ say("Import දෝෂය: " + error.message); return; }
    say(`Import කරමින්... ${Math.min(i+500, recs.length)} / ${recs.length}`);
  }
  say(`පොත් ${recs.length}ක් Import කළා ✔`); $("csv").value = ""; load();
}
</script>
</body>
</html>
