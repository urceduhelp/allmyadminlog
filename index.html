<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>allmyadmin</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #ffffff; --ink: #14202b; --muted: #5d6b78;
    --line: #cfd6dd; --accent: #0f5c63; --accent-ink: #ffffff; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11181e; --panel: #1a232b; --ink: #e8edf1; --muted: #93a1ad;
            --line: #2c3842; --accent: #5cc0c8; --accent-ink: #082a2d; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Iskoola Pota", "Noto Sans Sinhala", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px;
  }
  h1 { margin: 0 0 4px; font-size: 1.7rem; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 24px; color: var(--muted); font-size: .95rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus, button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    width: 100%; margin-top: 22px; padding: 12px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.3em; margin-top: 14px; font-size: .9rem; color: var(--err); }
  #app { display: none; max-width: 560px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
  .top span { color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; }
  button.ghost {
    background: none; border: 1px solid var(--line); color: var(--ink);
    padding: 8px 14px; border-radius: 8px; font: inherit; font-size: .85rem; cursor: pointer; white-space: nowrap;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 84px; padding: 12px; text-decoration: none; font-weight: 700; letter-spacing: .02em;
    color: var(--accent-ink); background: var(--accent); border-radius: 10px; word-break: break-word;
  }
  a.btn:hover { filter: brightness(1.08); }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- Login -->
<main class="card" id="login">
  <h1>allmyadmin</h1>
  <p class="sub">ඇතුළු වීමට ඔබේ ගිණුම භාවිතා කරන්න.</p>
  <div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="loginBtn" type="button">Sign in</button>
    <div class="msg" id="loginMsg" role="alert"></div>
  </div>
</main>

<!-- Protected content -->
<main class="card" id="app">
  <div class="top">
    <h1>allmyadmin</h1>
    <div style="display:flex;align-items:center;gap:10px;min-width:0">
      <span id="who"></span>
      <button class="ghost" id="logoutBtn" type="button">Sign out</button>
    </div>
  </div>
  <div class="grid">
<a class="btn" href="ctc.html">CTC</a>
<a class="btn" href="cla.html">CLASS</a>
<a class="btn" href="hpedia.html">HISTORYENCY</a>
<a class="btn" href="https://amilaeduhelp.github.io/sinhala-dictionary/">SINDIC</a>
<a class="btn" href="https://amilaeduhelp.github.io/vocabulary/">INDIC</a>
<a class="btn" href="https://urceduhelp.github.io/my-web-book/">WLINK</a>
<a class="btn" href="otherlink.html">OTHERL</a>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://jcijglwpkfluyzrltimk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);

  function show(session) {
    const signedIn = !!session;
    $("login").style.display = signedIn ? "none" : "block";
    $("app").style.display = signedIn ? "block" : "none";
    $("who").textContent = signedIn ? session.user.email : "";
  }

  async function signIn() {
    const btn = $("loginBtn"), msg = $("loginMsg");
    msg.textContent = "";
    btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    btn.disabled = false;
    if (error) msg.textContent = "Email හෝ password වැරදියි.";
    else $("password").value = "";
  }

  $("loginBtn").addEventListener("click", signIn);
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
  $("logoutBtn").addEventListener("click", () => sb.auth.signOut());

  sb.auth.onAuthStateChange((_event, session) => show(session));
  sb.auth.getSession().then(({ data }) => show(data.session));
</script>
</body>
</html>
